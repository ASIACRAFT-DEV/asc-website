name: Sync mod versions

# Regenerates versions.json from the asc-* mod repos and commits it when
# anything changed.
#
# 🔴 That commit does NOT trigger deploy.yml on its own. A push made with the
# default GITHUB_TOKEN is deliberately excluded from triggering other
# workflows (GitHub's recursion guard), so between 2026-09-04 and 2026-09-12
# 34 sync commits landed on main and the live site never rebuilt once — it
# served a versions.json generated 2026-09-03 while the repo copy was current.
# The deploy is therefore dispatched explicitly at the end of this job.
on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # manual "Run workflow" button
  repository_dispatch:        # optional: mod repos can fire {event_type: mod-pushed}
    types: [mod-pushed]

permissions:
  contents: write
  actions: write              # required to dispatch deploy.yml below

concurrency:
  group: sync-versions
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate versions.json
        env:
          # fine-grained PAT with read access to the ASIACRAFT-DEV repos
          GH_TOKEN: ${{ secrets.MODS_READ_TOKEN }}
        run: node scripts/sync-versions.mjs

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- versions.json; then
            echo "No version changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "asc-version-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add versions.json
            git commit -m "chore: sync live mod versions"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # See the header note: the commit above cannot trigger deploy.yml itself.
      - name: Deploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
